registry_id: "TR-2026-09"
title: "《训虾手册》受控术语与产品边界登记表"
version: "1.1.0"
status: "editorial-controlled"
language: "zh-CN"
verified_on: "2026-10-01"
normative_note: >-
  本文件是正式书稿的唯一受控术语登记表。定义冲突依次服从正式标准、
  固定版本产品文档、本登记表和本书原创方法论。产品实现名不得被改写为
  通用标准；本书方法论必须明确标注为“本书定义”。

controlled_values:
  status:
    - "standard"
    - "industry"
    - "product"
    - "methodology"
  scope:
    - "general"
    - "openclaw"
    - "hermes"
    - "muse"
    - "mcp"
    - "a2a"
    - "agent-skills"
    - "opentelemetry"
  definition_owner_pattern: "^(C(0[1-9]|1[0-9]|2[0-4])|PREFACE|APPENDIX-[A-G])$"

editorial_rules:
  - "首次出现时使用 preferred_zh，并在括号中给出 preferred_en；后文使用首选中文名或已登记的官方产品真名。"
  - "deprecated_terms 不得进入正文、配置、Schema 或图表；仅可在勘误、迁移说明中引用。"
  - "ambiguous_terms 只有在紧邻上下文已经消除歧义时才可使用。"
  - "do_not_confuse_with 中的对象必须在解释、图表和机器块中保持分离。"
  - "product_specific 为 true 时，定义只适用于 scope 中列出的产品或协议，不得外推为行业通则。"
  - "版本性产品定义必须与固定版本或核验日期一起使用。"

