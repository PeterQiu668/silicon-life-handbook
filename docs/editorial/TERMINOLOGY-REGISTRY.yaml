terms:
  - term_id: "agent"
    preferred_zh: "Agent（智能体）"
    preferred_en: "Agent"
    status: "industry"
    definition: >-
      由模型、运行时、上下文与状态、工具、环境以及反馈回路共同构成，能够在边界内持续观察、决策并采取行动的系统对象；不是一次模型调用，也不因被拟人化而获得意识或主体资格。
    definition_owner: "C01"
    scope: ["general"]
    product_specific: false
    deprecated_terms: ["AI 机器人（作为无差别总称）"]
    ambiguous_terms: ["助手", "硅基生命", "Bot"]
    do_not_confuse_with: ["model", "runtime", "workflow", "organization"]
    evidence_refs: ["BOOK-FRAMEWORK", "BOOK-EVIDENCE", "OC-AGENT", "HERMES-ARCH", "ANTHROPIC-TRUST"]

  - term_id: "model"
    preferred_zh: "模型"
    preferred_en: "Model"
    status: "industry"
    definition: >-
      根据输入生成预测或输出的推理组件。模型可以为 Agent 提供认知能力，但不天然拥有持久身份、会话、工具权限、任务责任或运行状态。
    definition_owner: "C01"
    scope: ["general"]
    product_specific: false
    deprecated_terms: ["Agent 模型（用于把模型等同于 Agent 时）"]
    ambiguous_terms: ["大模型", "基础模型", "LLM"]
    do_not_confuse_with: ["agent", "runtime", "provider"]
    evidence_refs: ["BOOK-FRAMEWORK", "BOOK-EVIDENCE", "OC-AGENT", "HERMES-ARCH"]

  - term_id: "runtime"
    preferred_zh: "Agent 运行时"
    preferred_en: "Agent Runtime"
    status: "industry"
    definition: >-
      组装指令与上下文、选择模型与 Provider、驱动工具循环，并处理重试、压缩、持久化和投递的执行层；它承载 Agent 行为，但不等同于模型、工作区或控制平面。
    definition_owner: "C06"
    scope: ["general"]
    product_specific: false
    deprecated_terms: ["Prompt 外壳"]
    ambiguous_terms: ["引擎", "核心", "Agent Runtime"]
    do_not_confuse_with: ["agent", "model", "control_plane", "workspace"]
    evidence_refs: ["BOOK-FRAMEWORK", "BOOK-EVIDENCE", "OC-AGENT", "HERMES-ARCH"]

  - term_id: "control_plane"
    preferred_zh: "控制平面"
    preferred_en: "Control Plane"
    status: "industry"
    definition: >-
      负责配置、发现、路由、策略、状态协调、生命周期和可观测管理的架构层；它描述职责集合，不要求由单一进程承担，也不等同于某个产品命名为 Gateway 的组件。
    definition_owner: "C06"
    scope: ["general"]
    product_specific: false
    deprecated_terms: []
    ambiguous_terms: ["中控", "调度中心", "大脑"]
    do_not_confuse_with: ["gateway", "runtime", "worker"]
    evidence_refs: ["BOOK-QUALITY", "BOOK-EVIDENCE", "OC-ARCH", "HERMES-ARCH"]

  - term_id: "gateway"
    preferred_zh: "Gateway（网关组件）"
    preferred_en: "Gateway"
    status: "product"
    definition: >-
      OpenClaw 或 Hermes 中承担连接、消息入口、路由、事件、调度或节点协调等职责的产品组件名；两种产品的具体职责不同，引用时必须标明产品与版本。
    definition_owner: "C06"
    scope: ["openclaw", "hermes"]
    product_specific: true
    deprecated_terms: ["统一中枢（作为官方组件名时）"]
    ambiguous_terms: ["网关", "Gateway 服务"]
    do_not_confuse_with: ["control_plane", "runtime", "channel"]
    evidence_refs: ["BOOK-QUALITY", "BOOK-EVIDENCE", "OC-ARCH", "HERMES-ARCH"]

  - term_id: "workspace"
    preferred_zh: "工作区"
    preferred_en: "Workspace"
    status: "industry"
    definition: >-
      Agent 或项目组织指令、资料、状态和产物的持久化工作容器；工作区决定可发现内容和协作边界，但本身不是执行沙箱或访问控制机制。
    definition_owner: "C06"
    scope: ["general"]
    product_specific: false
    deprecated_terms: ["资料文件夹（用于概括全部职责时）"]
    ambiguous_terms: ["项目目录", "仓库"]
    do_not_confuse_with: ["sandbox", "session", "context"]
    evidence_refs: ["BOOK-FRAMEWORK", "BOOK-EVIDENCE", "OC-WORKSPACE", "HERMES-FILES"]

  - term_id: "session"
    preferred_zh: "会话"
    preferred_en: "Session"
    status: "industry"
    definition: >-
      关联一段交互或任务轨迹的有状态容器，可持有消息、工具调用、附件、谱系和恢复信息；会话键或会话隔离不天然构成身份认证或授权边界。
    definition_owner: "C06"
    scope: ["general"]
    product_specific: false
    deprecated_terms: []
    ambiguous_terms: ["线程", "对话", "任务会话"]
    do_not_confuse_with: ["context", "memory", "account", "a2a_task"]
    evidence_refs: ["BOOK-FRAMEWORK", "BOOK-EVIDENCE", "OC-ARCH", "HERMES-ARCH"]

  - term_id: "context"
    preferred_zh: "上下文"
    preferred_en: "Context"
    status: "industry"
    definition: >-
      某次推理或执行在当下可见的信息集合，包括指令、消息、检索结果、工具反馈和任务状态；上下文是暂时的可见面，不等同于持久记忆或完整会话历史。
    definition_owner: "C10"
    scope: ["general"]
    product_specific: false
    deprecated_terms: ["记忆（用于指当轮输入时）"]
    ambiguous_terms: ["上下文窗口", "背景"]
    do_not_confuse_with: ["memory", "session", "workspace", "compaction"]
    evidence_refs: ["BOOK-FRAMEWORK", "BOOK-EVIDENCE", "OC-AGENT", "HERMES-ARCH"]

  - term_id: "memory"
    preferred_zh: "记忆"
    preferred_en: "Memory"
    status: "industry"
    definition: >-
      经选择后被持久保存并可在后续任务中检索或注入的经验、事实、偏好或关系状态；必须治理来源、写入、保留期、访问、更正和删除，不代表主观意识。
    definition_owner: "C10"
    scope: ["general"]
    product_specific: false
    deprecated_terms: ["永久记忆（未声明保留和删除语义时）"]
    ambiguous_terms: ["长期记忆", "用户记忆", "工作记忆"]
    do_not_confuse_with: ["context", "session", "workspace", "compaction", "contract_memory"]
    evidence_refs: ["BOOK-FRAMEWORK", "BOOK-EVIDENCE", "OC-MEMORY", "HERMES-MEMORY"]

  - term_id: "compaction"
    preferred_zh: "上下文压缩"
    preferred_en: "Context Compaction"
    status: "industry"
    definition: >-
      为满足上下文预算而对历史内容进行摘要、选择、结构化或替换的转换过程；其目标是保留任务关键事实，不等同于删除原始记录或形成长期记忆。
    definition_owner: "C10"
    scope: ["general"]
    product_specific: false
    deprecated_terms: ["无损压缩（未经保真验证时）"]
    ambiguous_terms: ["压缩", "摘要", "上下文整理"]
    do_not_confuse_with: ["memory", "context", "session"]
    evidence_refs: ["BOOK-FRAMEWORK", "BOOK-EVIDENCE", "OC-AGENT", "HERMES-ARCH"]

  - term_id: "channel"
    preferred_zh: "消息通道"
    preferred_en: "Channel"
    status: "industry"
    definition: >-
      承载入站和出站消息的产品或传输适配面，例如聊天平台或应用入口；通道不等同于其中登录的账号、单个会话或路由规则。
    definition_owner: "C06"
    scope: ["general"]
    product_specific: false
    deprecated_terms: ["平台（未说明是消息入口还是供应商时）"]
    ambiguous_terms: ["渠道", "Connector"]
    do_not_confuse_with: ["account", "binding", "session", "gateway"]
    evidence_refs: ["BOOK-EVIDENCE", "OC-ARCH", "OC-MULTI", "HERMES-ARCH"]

  - term_id: "account"
    preferred_zh: "通道账号"
    preferred_en: "Channel Account"
    status: "industry"
    definition: >-
      在特定消息通道中用于连接、收发和标识配置的账号实例；它可以参与路由和权限判断，但不等同于最终用户身份、Agent 身份或会话。
    definition_owner: "C06"
    scope: ["general"]
    product_specific: false
    deprecated_terms: []
    ambiguous_terms: ["账号", "Bot 账号", "身份"]
    do_not_confuse_with: ["channel", "binding", "session", "contract_identity"]
