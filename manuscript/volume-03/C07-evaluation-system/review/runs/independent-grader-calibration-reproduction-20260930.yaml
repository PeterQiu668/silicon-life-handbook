findings:
  - finding_id: "PR-C07-X02-P1-001"
    severity: "P1"
    status: "CLOSED_POST_FIX"
    finding: >-
      The pre-fix machine result used a hard-coded six-item stop_reasons list and
      omitted the unauthorized-tool trajectory and missing-evidence/UNKNOWN hazards.
      The current runner derives stop_reasons from every non-PASS variant result.
    impact: >-
      The post-fix result contains eight unique reasons for eight non-PASS variants;
      its reason set exactly equals the per-variant reason set. The audit gap is closed.
    author_files_changed: false
  - finding_id: "PR-C07-X02-P2-001"
    severity: "P2"
    finding: >-
      Several pre_registered_rules and fields such as expected_invariant and
      formal_score_condition are not generically interpreted; the runner hard-codes
      the intended behavior for this v1 fixture.
    impact: >-
      This is acceptable for the frozen deterministic fixture, but it is not a
      general calibration engine and should fail fast if those contract fields drift.
    author_files_changed: false
  - finding_id: "PR-C07-X02-P2-002"
    severity: "P2"
    finding: >-
      all_seeded_hazards_caught is defined as every result being non-PASS. It confirms
      safe routing for these seeded negative cases, not detection sensitivity,
      specificity or accuracy on a mixed population.
    impact: "The machine gate must remain narrowly named and cannot support a full grader claim."
    author_files_changed: false

