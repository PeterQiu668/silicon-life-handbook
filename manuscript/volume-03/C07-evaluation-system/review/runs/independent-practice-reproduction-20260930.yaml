practice_findings:
  - finding_id: "PR-C07-P1-001"
    severity: "P1"
    finding: >-
      Running the README command in the author directory writes to the fixed author
      result and summary paths. A non-author can execute it, but cannot preserve the
      original evidence unless they first copy the harness and input or the harness
      gains an explicit output directory option.
    current_mitigation: "This review ran two unmodified copies in separate fresh temporary directories."
  - finding_id: "PR-C07-P1-002"
    severity: "P1"
    finding: >-
      X-C07-02 is procedurally specified but the package does not contain executable
      fixtures and preserved runs for all eight requested bias/red-team variants.
    current_mitigation: "Keep the exercise and real grader calibration at REVIEW_REQUIRED."
  - finding_id: "PR-C07-P2-001"
    severity: "P2"
    finding: >-
      The input contract says network disabled-by-contract, but the harness does not
      enforce an OS network sandbox. The script itself makes no network call.
    current_mitigation: "Do not describe the reproduction as sandbox enforcement evidence."
  - finding_id: "PR-C07-P2-002"
    severity: "P2"
    finding: >-
      The harness assumes a well-formed trusted fixture and does not fail fast on
      duplicate task IDs, invalid enum values or inconsistent grader labels.
    current_mitigation: "Current input passed independent uniqueness, membership and count checks."

