exercise_executability:
  X-C08-01:
    verdict: "PASS_IN_SYNTHETIC_SCOPE_PROVISIONAL"
    non_author_execution_completed: true
    basis:
      - "The linked harness runs with Python standard library only."
      - "Baseline and all three cumulative revisions are emitted in one deterministic run."
      - "All train, regression, holdout and safety records are retained."
      - "The safety and holdout failures stop release despite 6/6 training."
      - "A second reviewer reproduced byte-identical results twice."
    limitations:
      - "The candidate revisions do not have separate content hashes or saved exact diffs."
      - "Holdout and safety answer keys share one source file with learner and reviewer logic."
      - "No real rollback target or external state was exercised."
      - "C07/C08 terminology is aligned, but the amended harness bytes require independent regression."
  X-C08-02:
    verdict: "REVIEW_REQUIRED"
    non_author_execution_completed: false
    basis:
      - "The training-score bypass injection is represented by round 3 and is correctly refused."
      - "The exercise text defines multi-variable and teacher-as-final-judge injections."
    missing_executable_evidence:
      - "A combined model+prompt+tool mutation run and attribution refusal record."
      - "An access-control event proving teacher cannot read holdout answers."
      - "A replacement blinded reviewer run."
      - "Preserved rejection logs for all three injections."

