execution:
  method: >-
    Copied the author harness without modification into two separately created
    mktemp directories, executed each copy once, redirected stdout to an independent
    result file inside each temporary directory, and compared both outputs byte-for-byte.
  commands:
    - "cp review/runs/synthetic_training_harness.py <fresh-temp-a>/"
    - "cp review/runs/synthetic_training_harness.py <fresh-temp-b>/"
    - "python3 <fresh-temp-a>/synthetic_training_harness.py > <fresh-temp-a>/result.json"
    - "python3 <fresh-temp-b>/synthetic_training_harness.py > <fresh-temp-b>/result.json"
  host_network_sandbox_enforced: false
  script_network_calls_observed: 0
  script_external_write_calls_observed: 0
  credentials_used: false
  real_user_or_customer_data_used: false
  real_platforms_or_models_called: false
  production_writes: 0
  note: >-
    An AST inspection found imports limited to __future__, collections, hashlib,
    json and platform, and found no open/write, socket, HTTP, subprocess, eval or
    dynamic-import calls. Stdout redirection wrote only the two temporary result files.

