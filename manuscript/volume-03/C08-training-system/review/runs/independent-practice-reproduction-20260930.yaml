practice_findings:
  - finding_id: "PR-C08-P1-001"
    severity: "P1"
    finding: >-
      X-C08-01 requires an exact per-round diff and candidate hash, but the executed
      evidence identifies revisions only by names and records one sample-manifest hash.
      It does not preserve distinct candidate content hashes or machine-readable diffs.
    impact: "A reviewer can reproduce scores but cannot independently prove the exact candidate payload promoted between rounds."
  - finding_id: "PR-C08-P1-002"
    severity: "P1"
    finding: >-
      The harness final_decision and rollback fields are fixed output literals rather
      than values derived from the computed final gates or observed external state.
    impact: "They match this fixture, but future fixture changes could leave the stated terminal decision inconsistent with computed metrics."
  - finding_id: "PR-C08-P1-003"
    severity: "P1"
    finding: >-
      X-C08-02 has no independent executable injection harness or preserved run for
      the multi-variable and teacher-access-control cases.
    impact: "The red-team exercise remains REVIEW_REQUIRED."
  - finding_id: "PR-C08-P2-001"
    severity: "P2"
    finding: >-
      Logical teacher/learner/reviewer separation is declared but all samples, answer
      keys and functions coexist in one Python process and source file.
    impact: "The run demonstrates decision logic, not enforced hidden-set isolation."
  - finding_id: "PR-C08-P2-002"
    severity: "P2"
    finding: >-
      The output embeds platform.python_version(), so byte identity is guaranteed only
      under the same Python version and platform behavior, not across arbitrary runtimes.
    impact: "Cross-runtime reproduction should compare normalized semantic fields as well as bytes."
  - finding_id: "PR-C08-P2-003"
    severity: "P2"
    finding: >-
      The exercise links the harness but does not place the exact run command in the
      exercise or chapter README; it appears in the author self-check.
    impact: "A non-author can infer the command, but the practice path should be explicit."

gate:
  synthetic_three_round_reproduction: "PASS"
  byte_repeatability_same_runtime: "PASS"
  stop_and_rollback_decision_for_fixture: "PASS"
