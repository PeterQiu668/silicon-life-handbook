control_gate_boundary:
  proves:
    - "The frozen in-memory state machine reproduces five safe controls and catches four seeded unsafe states."
    - "Critical compaction slots can be compared field-by-field and a bad summary is quarantined."
    - "Suppress, expire, supersede and physical-delete semantics remain distinct in the fixture."
    - "Declared deletion scope reaches zero while artifact/export/backup residuals remain truthfully reported."
    - "Tombstone replay prevents declared-scope resurrection after in-memory restore."
    - "A late lineage write is removed by the deterministic second scan."
  does_not_prove:
    - "Physical erasure or residual discovery on any real store, filesystem, vector index, backup or provider."
    - "Real OpenClaw, Hermes, Muse, database, cache, session, artifact or export behavior."
    - "Real concurrent scheduling, locking, writer fencing or race-freedom."
    - "Durable backup integrity, corruption handling, restore safety, legal deletion or compliance."
    - "External owner acknowledgement or deadline completion for residuals."

findings:
  - finding_id: "PR-C10-STATEFUL-P2-001"
    severity: "P2"
    finding: >-
      The concurrency control is a deterministic sequential injection: the runner
      deletes, adds a late derived record, and then performs a second scan. It does
      not create competing threads/processes or test a real storage fence.
    impact: "Safe for control-logic validation; real race and locking behavior remain REVIEW_REQUIRED."
    author_files_changed: false
  - finding_id: "PR-C10-STATEFUL-P2-002"
    severity: "P2"
    finding: >-
      Backup, restore, tombstone, receipts, artifact/export surfaces and residual
      owner/deadline are in-memory fixture objects rather than durable or external systems.
    impact: "The PASS cannot be called physical deletion, durable restore or external residual attestation."
    author_files_changed: false
  - finding_id: "PR-C10-STATEFUL-P2-003"
    severity: "P2"
    finding: >-
      Input validation checks unique memory IDs, the eight initial surfaces and
      declared/residual disjointness, but does not explicitly validate that the
      physical-delete target exists, every declared surface is registered, or every
      residual name belongs to the supported surface-plus-backup set.
    impact: "The frozen input is valid; a future general runner should fail fast with explicit schema errors."
    author_files_changed: false

