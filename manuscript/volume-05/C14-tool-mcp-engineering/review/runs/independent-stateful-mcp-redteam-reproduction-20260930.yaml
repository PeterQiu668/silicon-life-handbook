limitations:
  - Public hostnames are accepted syntactically; DNS resolution, rebinding and connection-address binding are not exercised.
  - OAuth issuer, scope, expiry, refresh and actual resource-server behavior are not exercised.
  - Result injection uses a deterministic quarantine branch; the result payload is not parsed and no model is involved.
  - The path traversal negative mutation shows that an outside path without the named canary is not independently failed.
  - Revocation is an in-memory control, not a persisted Session or platform checkpoint.
  - Grandchild process, process-group kill and real residual cleanup are not proven; R20 remains REVIEW_REQUIRED.
  - This evidence is not MCP conformance, product certification or a real-platform security claim.
