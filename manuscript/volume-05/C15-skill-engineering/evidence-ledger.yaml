claims:
  - {evidence_id: E-C15-001, claim: "Skill 是可发现、按需加载、版本化与可测试的程序性知识包，不是一段换名 prompt。", class: METHODOLOGY, stability: stable, source_ids: [TERMS, AS-SPEC, C15-PREFLIGHT], limitations: "具体目录与加载行为随客户端变化。"}
  - {evidence_id: E-C15-002, claim: "Agent Skills 当前规范要求 Skill 目录至少含 SKILL.md，frontmatter 必填 name 和 description。", class: STANDARD-FACT, stability: dynamic-standard, source_ids: [AS-SPEC], limitations: "出版前需复核规范版本。"}
  - {evidence_id: E-C15-003, claim: "Agent Skills 的 license、compatibility、metadata、allowed-tools 是可选字段，allowed-tools 为实验字段且客户端支持可不同。", class: STANDARD-FACT, stability: evolving, source_ids: [AS-SPEC], limitations: "不能当统一 Runtime 权限。"}
  - {evidence_id: E-C15-004, claim: "渐进披露先暴露 name/description，选中后加载 SKILL.md，再按需加载 scripts/references/assets。", class: STANDARD-FACT, stability: evolving, source_ids: [AS-SPEC, AS-CLIENT, AS-PRACTICE], limitations: "本书额外证据层不是标准层。"}
  - {evidence_id: E-C15-005, claim: "Tool、Skill、Workflow、Plugin、Hook、Provider、Channel Adapter 是不同对象；复合包需逐组件治理。", class: METHODOLOGY, stability: stable, source_ids: [TERMS, C14, C06, C15-PREFLIGHT], limitations: "产品命名不必与本书分类相同。"}
  - {evidence_id: E-C15-006, claim: "Skill 能引用脚本或 Tool，不意味着获得 Tool、secret、network、host 或业务权限。", class: METHODOLOGY, stability: stable, source_ids: [AS-SPEC, C05, C06, C14, C14-CONTRACT, C15-PREFLIGHT], limitations: "真实权限由 Runtime 和安全控制面决定。"}
  - {evidence_id: E-C15-007, claim: "Registry 条目需记录 owner、source、exact revision/digest、依赖、兼容、权限、评测、批准、撤回与替代。", class: METHODOLOGY, stability: stable, source_ids: [C15-PREFLIGHT, QUALITY], limitations: "字段是本书方法，不是 Agent Skills 标准。"}
  - {evidence_id: E-C15-008, claim: "Plugin 是执行代码，应把来源审查、禁用态安装、影子、有限启用、更新复审、隔离、卸载和残余核查分开。", class: METHODOLOGY, stability: stable, source_ids: [OC-PLUGIN, HE-PLUGIN-FIXED, SLSA, NIST-SSDF], limitations: "命令和默认值依平台版本。"}
  - {evidence_id: E-C15-009, claim: "签名、digest、provenance、SBOM、漏洞扫描和行为评测各自回答不同问题，不能互相替代。", class: METHODOLOGY, stability: stable, source_ids: [SLSA, SIGSTORE, CISA-SBOM, SPDX, OWASP-AGENTIC], limitations: "任何一项都不证明语义善意或零漏洞。"}
  - {evidence_id: E-C15-010, claim: "SLSA v1.2 provenance 支持记录 artifact 的来源、时间和生产方式，构建等级进一步约束 builder。", class: STANDARD-FACT, stability: versioned, source_ids: [SLSA], limitations: "不证明源码和运行行为安全。"}
  - {evidence_id: E-C15-011, claim: "Sigstore 通过签名身份、证书和透明日志提供可验证签署记录。", class: OFFICIAL-GUIDANCE, stability: evolving, source_ids: [SIGSTORE], limitations: "签名身份可被攻破，签名内容仍可恶意。"}
  - {evidence_id: E-C15-012, claim: "CISA 2025 SBOM 最小要素 public-comment draft 与 SPDX 可记录软件组件、版本、身份和关系，但不能完整表达 Skill 指令、模板、评测和业务权限。", class: METHODOLOGY, stability: evolving, source_ids: [CISA-SBOM, SPDX], limitations: "CISA 文件不是最终规则；能力供应链清单是本书扩展。"}
  - {evidence_id: E-C15-013, claim: "TUF 的更新安全思想覆盖 rollback、freeze、mix-and-match、key compromise 和 key replacement/revocation。", class: OFFICIAL-GUIDANCE, stability: stable, source_ids: [TUF], limitations: "不代表 OpenClaw/Hermes Registry 已实现 TUF。"}
  - {evidence_id: E-C15-014, claim: "程序性 Memory 或一次运行经验只能形成 Skill/Plugin 变更提案，不能自动发布；生产问题进入训练和候选回到生产遵循 C02 双闭环。", class: METHODOLOGY, stability: project-controlled, source_ids: [C02, C08, C13, C13-ARCH, DECISIONS, C15-PREFLIGHT], limitations: "C08 细化训练干预和候选证据；C18 拥有自我改进与 D20 五类漂移的主定义权。"}
  - {evidence_id: E-C15-015, claim: "生产级候选链使用 training、regression、holdout、representative real-world 四个数据层；security/red-team 作为横切非补偿切片，并结合提案、不可变候选、审批、影子、固化、限量发布、观察和回滚。", class: METHODOLOGY, stability: project-controlled, source_ids: [C07, C08, DECISIONS, C15-PREFLIGHT], limitations: "D22 决定数据层；具体阈值由风险和任务确定。"}
  - {evidence_id: E-C15-016, claim: "撤回必须处理新发现、Plugin/Skill/Hook/Provider/Channel、凭证、旧 session、Node/Worker、sandbox/cache 和替代传播，并分离任务、Artifact、交付与环境终态。", class: METHODOLOGY, stability: stable, source_ids: [C15-PREFLIGHT, C06, C08, C09, DECISIONS], limitations: "无法触达副本需报告 REVIEW_REQUIRED，不以技术执行替代 D21 完成证据。"}
  - {evidence_id: E-C15-017, claim: "OpenClaw 固定版支持多来源 Skill、优先级和 managed revisions，session 可保留选定 revision。", class: VERSION-FACT, stability: versioned, source_ids: [OC-REL, OC-SKILLS], limitations: "只适用于 eb377ac；本地配置需实测。"}
  - {evidence_id: E-C15-018, claim: "OpenClaw 固定版 Workshop proposal 具有 pending、target binding、hash、scanner、apply、stale 与 rollback metadata。", class: VERSION-FACT, stability: versioned, source_ids: [OC-WORKSHOP, OC-WORKSHOP-LIFECYCLE], limitations: "apply 获准落盘不等于外部评测通过。"}
