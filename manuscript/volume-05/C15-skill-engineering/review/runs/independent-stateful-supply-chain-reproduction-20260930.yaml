pre_fix_limitations:
  - NFKC and casefold do not detect all Unicode confusables.
  - Holdout access and blind-review assignment are synthetic access-matrix controls; no real blind reviewer ran.
  - Revocation surfaces are in-memory; cache is folded into worker state rather than modeled independently.
  - Replacement baseline, candidate and gate outcomes are hardcoded in the runner and ignore trial-level candidate overrides.
  - The top-level security cross-cutting flag and pair counts are reported but not enforced as schema gates.
  - The real-world execution counter is not a general guard; its zero value is valid only for the frozen input where both real-world records are non-executing REVIEW_REQUIRED paths.
  - No real platform, plugin, registry, signature, provenance, SBOM or cross-runtime revocation was exercised.
residual_limitations:
  - The curated Cyrillic and Greek skeleton is not exhaustive Unicode confusable detection.
  - Security coverage failure is exposed as run_schema_invariants_pass=false but does not itself force a nonzero process exit.
  - All state, identity, filesystem and lifecycle checks remain synthetic; no real OpenClaw, Hermes, Muse, Plugin, Registry, signature, provenance, SBOM, vulnerability service or cross-runtime revocation ran.
  - Representative real-world synthetic execution is capped at REVIEW_REQUIRED and does not constitute real-world validation.
  - Complete X-C12-01, X-C12-02 and the overall practice gate remain REVIEW_REQUIRED.
