claims:
  - {evidence_id: E-C16-001, claim: "受控主动性由有意义信号、既定目标、当前权限和安静策略共同约束，不以唤醒或通知频率衡量。", class: METHODOLOGY, stability: stable, source_ids: [TERMS, C16-PREFLIGHT], limitations: "任务域权重和阈值需实例化。"}
  - {evidence_id: E-C16-002, claim: "触发资格、授权资格与净价值资格必须分开裁决，任一安全或授权硬失败不能被价值分数抵消。", class: METHODOLOGY, stability: stable, source_ids: [C16-PREFLIGHT, C17-PREFLIGHT, QUALITY], limitations: "净价值是本书排序方法，不是平台算法。"}
  - {evidence_id: E-C16-003, claim: "Trigger 只说明为什么开始判断，不产生 authority，也不证明 completion。", class: METHODOLOGY, stability: stable, source_ids: [C06, C09, C16-PREFLIGHT, DECISIONS], limitations: "具体事件身份由平台与安全控制核验。"}
  - {evidence_id: E-C16-004, claim: "Heartbeat、Cron、Event、Queue、Hook、Webhook、Manual 与 Standing Order 是不同机制，复合自动化需逐项治理。", class: METHODOLOGY, stability: stable, source_ids: [TERMS, C06, C16-PREFLIGHT], limitations: "Standing Order 是 OpenClaw 产品对象。"}
  - {evidence_id: E-C16-005, claim: "静默可以是已观察、已判断且有证据的正确输出，但不得掩盖遗漏或高严重度升级。", class: METHODOLOGY, stability: stable, source_ids: [TERMS, C16-PREFLIGHT], limitations: "需用留出/回放/抽查估计遗漏。"}
  - {evidence_id: E-C16-006, claim: "去重、重放防护、合并、冷却、静默时段与暂停解决不同问题，不能由一个 throttle 字段替代。", class: METHODOLOGY, stability: stable, source_ids: [C16-PREFLIGHT, C14], limitations: "具体窗口随任务域变化。"}
  - {evidence_id: E-C16-007, claim: "定时路径应保存 IANA 时区、日历版本、DST、misfire、catch-up、最大追赶和 schedule version。", class: METHODOLOGY, stability: stable, source_ids: [C16-PREFLIGHT], limitations: "不是任何平台统一 schema。"}
  - {evidence_id: E-C16-008, claim: "原始 UNKNOWN 是证据状态，最终只能补证、FAIL 或 REVIEW_REQUIRED；副作用未知时不得盲重放。", class: METHODOLOGY, stability: stable, source_ids: [C06, C07, C14, C16-PREFLIGHT, DECISIONS], limitations: "若同时发生安全硬失败可直接 FAIL。"}
  - {evidence_id: E-C16-009, claim: "完成需分离技术执行、交付/目标端可见和业务验收/环境终态，任一单一 success 不足以推出完成。", class: METHODOLOGY, stability: project-controlled, source_ids: [DECISIONS, C09, C21-PREFLIGHT, C23-PREFLIGHT], limitations: "无投递要求的任务应显式标 NOT_REQUIRED。"}
  - {evidence_id: E-C16-010, claim: "停止请求与停止确认、暂停与取消、熔断与恢复必须分离；重启不证明恢复。", class: METHODOLOGY, stability: stable, source_ids: [C06, C14, C16-PREFLIGHT, C24-PREFLIGHT], limitations: "真实执行面需实际 stop receipt。"}
  - {evidence_id: E-C16-011, claim: "sentinel 不得与被监控对象共享唯一 Gateway、Provider、credential、network 或 datastore 故障组合。", class: METHODOLOGY, stability: stable, source_ids: [C16-PREFLIGHT, C22-PREFLIGHT, C23-PREFLIGHT], limitations: "隔离程度需按风险由后章冻结。"}
  - {evidence_id: E-C16-012, claim: "Webhook 应在业务处理前验证大小/方法、来源、签名、时间窗、nonce/event id、tenant 和重放，再入受控队列并回读权威状态。", class: METHODOLOGY, stability: stable, source_ids: [C16-PREFLIGHT, C22-PREFLIGHT], limitations: "具体签名算法属于集成事实。"}
  - {evidence_id: E-C16-013, claim: "Hook 是宿主生命周期内回调，可能共享 Gateway 信任边界；可发现或可加载不证明实际触发或安全。", class: METHODOLOGY, stability: stable, source_ids: [TERMS, OC-HOOKS, C15], limitations: "生命周期点和隔离随版本。"}
  - {evidence_id: E-C16-014, claim: "OpenClaw 固定版把 Standing Order 称为授予 permanent operating authority 的持久对象；本书将其治理为可撤销、有限 scope、需 owner/review/expiry/stop/version 与 C17 再认证的持续授权。", class: METHODOLOGY, stability: stable, source_ids: [TERMS, OC-STANDING, C17-PREFLIGHT], limitations: "前半句是 OpenClaw 版本事实，后半句是本书更严格治理；不得把 permanent 解释为无限、不可撤销或跨版本继续。"}
