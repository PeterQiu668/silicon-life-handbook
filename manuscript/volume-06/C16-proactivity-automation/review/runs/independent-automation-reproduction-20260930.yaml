findings:
  - id: P1-C13-01
    title: signal identity replay and freshness are pre-adjudicated rather than derived
    severity: P1
    status: closed_for_individual_post_fix_controls
    minimum_fix_contract:
      - compute replay from event ID and business idempotency ledger
      - compute freshness from event observed time TTL and clock policy
      - preserve zero-new-effect evidence for duplicate and stale signals
  - id: P1-C13-02
    title: approval revocation and stop confirmation are not stateful
    severity: P1
    status: closed_for_individual_post_fix_controls
    minimum_fix_contract:
      - require an available approval surface and versioned approval record
      - re-read authority before effect execution
      - separate stop requested from stop confirmed
      - block completion and restore before stop confirmation
  - id: P1-C13-03
    title: completion notification and external-effect evidence can be hardcoded or ignored
    severity: P1
    status: closed_for_individual_post_fix_controls
    minimum_fix_contract:
      - require successful execution evidence before technical PASS
      - attach evidence IDs to artifact delivery and environment acceptance
      - enforce notification count quiet policy and storm budget
      - derive external-side-effect count from an effect ledger
  - id: P1-C13-04
    title: UNKNOWN sentinel and recovery controls lack stateful evidence
    severity: P1
    status: closed_for_individual_post_fix_controls
    minimum_fix_contract:
      - record reconcile readback retry attempts and idempotency reuse
      - make an executed blind retry a hard failure
      - compare explicit sentinel fault-domain sets
      - require passing recovery probes and phased restore evidence
  - id: P1-C13-05
    title: declared trial notification and side-effect budgets are not enforced
    severity: P1
    status: closed_for_individual_post_fix_controls
    minimum_fix_contract:
      - validate generated trials against max_trials before execution
      - validate notification counts per trial
      - fail when observed external side effects exceed the contract
