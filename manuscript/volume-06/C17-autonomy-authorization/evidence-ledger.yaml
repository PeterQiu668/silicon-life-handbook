claims:
  - {evidence_id: E-C17-001, claim: "自主、能力、系统权限与组织责任是四个不可互推的轴。", class: METHODOLOGY, source_ids: [TERMS, PREFLIGHT, DECISIONS], limitations: "具体岗位需实例化。"}
  - {evidence_id: E-C17-002, claim: "任务级自主只使用 AU-L0观察至 AU-L4受限自主五级。", class: METHODOLOGY, source_ids: [BOOK-V2, C17-CARD, TERMS, DECISIONS], limitations: "不是外部标准。"}
  - {evidence_id: E-C17-003, claim: "回答、发现、提案、准备、受控执行、协调、负责是行为，不新增自主等级。", class: METHODOLOGY, source_ids: [PREFLIGHT, DECISIONS], limitations: "负责不转移最终组织责任。"}
  - {evidence_id: E-C17-004, claim: "AU-L0—AU-L4 与 MAT-L0—MAT-L5 使用独立命名空间。", class: METHODOLOGY, source_ids: [TERMS, DECISIONS, C27-P], limitations: "纸书简称不用于机器产物。"}
  - {evidence_id: E-C17-005, claim: "影响、可逆性、敏感性、不确定性构成联合风险门，不做可补偿平均。", class: METHODOLOGY, source_ids: [C04-RISK, PREFLIGHT, QUALITY], limitations: "阈值由组织校准。"}
  - {evidence_id: E-C17-006, claim: "五维自主半径由 data、action、time、responsibility、evidence 的交集构成。", class: METHODOLOGY, source_ids: [TERMS, PREFLIGHT], limitations: "不是平台原生 schema。"}
  - {evidence_id: E-C17-007, claim: "聊天同意只构成 intent evidence，不能自动成为 authority evidence。", class: METHODOLOGY, source_ids: [TERMS, PREFLIGHT, NIST-BLOG], limitations: "仍需认证主体和授权服务。"}
  - {evidence_id: E-C17-008, claim: "授权至少绑定对象、动作、范围、参数、时窗和批准者。", class: METHODOLOGY, source_ids: [TERMS, PREFLIGHT, NIST-ID], limitations: "高风险还需更多字段。"}
  - {evidence_id: E-C17-009, claim: "委托只能衰减，子授权是父授权、委托者权限与子任务最小需求的交集。", class: METHODOLOGY, source_ids: [PREFLIGHT, C19-P, C20-P, NIST-BLOG], limitations: "真实 identity graph 待实施。"}
  - {evidence_id: E-C17-010, claim: "撤销必须级联到子授权、session、cache、queue、grant和临时凭证并做负向访问测试。", class: METHODOLOGY, source_ids: [PREFLIGHT, C16-SM, C22-P, C24-P], limitations: "平台传播需实测。"}
  - {evidence_id: E-C17-011, claim: "最小权限、JIT、双人复核与break-glass解决不同问题，不能互相替代。", class: METHODOLOGY, source_ids: [PREFLIGHT, C22-P, C24-P], limitations: "组织紧急政策另行批准。"}
  - {evidence_id: E-C17-012, claim: "双人复核要求两个独立且有资格的身份，不是同一人两次。", class: METHODOLOGY, source_ids: [PREFLIGHT], limitations: "独立性需身份图验证。"}
  - {evidence_id: E-C17-013, claim: "break-glass必须预定义紧急类型、窄权限、短时自动过期、强审计与事后独立复核。", class: METHODOLOGY, source_ids: [PREFLIGHT, C22-P, C24-P], limitations: "不是日常提权路径。"}
  - {evidence_id: E-C17-014, claim: "拒绝、降级、取消、接管、过期和撤销是合法终态或状态转移。", class: METHODOLOGY, source_ids: [PREFLIGHT, C16-SM], limitations: "执行面停止仍需回执。"}
  - {evidence_id: E-C17-015, claim: "取消不等于停止确认，取消也不等于回滚；UNKNOWN必须先对账再决定重试。", class: METHODOLOGY, source_ids: [C06, C14, C16-SM, DECISIONS], limitations: "外部补偿由具体系统支持。"}
  - {evidence_id: E-C17-016, claim: "主体、对象、参数、工具、模型、策略、环境或风险重大变化触发再认证。", class: METHODOLOGY, source_ids: [PREFLIGHT, C18-P, C24-P], limitations: "重大性阈值按任务域。"}
  - {evidence_id: E-C17-017, claim: "trigger不产生authority，authority也不证明D21三层completion。", class: METHODOLOGY, source_ids: [C16, DECISIONS, C09], limitations: "各层需独立证据。"}
  - {evidence_id: E-C17-018, claim: "OpenClaw固定版多层policy收敛，deny不能由下游放宽。", class: VERSION-FACT, source_ids: [OC-REL, OC-PERM], limitations: "只适用于固定提交。"}
  - {evidence_id: E-C17-019, claim: "OpenClaw exec approval叠加于tool policy/elevated，不能替代业务授权。", class: VERSION-FACT, source_ids: [OC-APPROVAL], limitations: "主要覆盖host exec/MCP grant。"}
  - {evidence_id: E-C17-020, claim: "OpenClaw Binding选择Agent，Node pairing建立设备身份，二者均不等于动作授权。", class: VERSION-FACT, source_ids: [OC-BINDING, OC-PERM], limitations: "路由和身份仍需业务授权。"}
  - {evidence_id: E-C17-021, claim: "OpenClaw单Gateway是单操作者或互信团队信任域，approvals不是敌对多租户授权。", class: VERSION-FACT, source_ids: [OC-TRUST, OC-APPROVAL], limitations: "不是部署安全证明。"}
  - {evidence_id: E-C17-022, claim: "Hermes 0.20.1只作发行锚点，dangerous-command approval等按核验日动态文档处理。", class: DYNAMIC-OFFICIAL, source_ids: [HE-REL, HE-SEC], limitations: "不得倒填为固定实现。"}
  - {evidence_id: E-C17-023, claim: "Muse Sentinel、scoped capability、JIT与takeover均为Meta厂商声明，未独立验证。", class: VENDOR-CLAIM, source_ids: [MUSE-NEWS, MUSE-SEC], limitations: "不能推断内部同构或效果。"}
  - {evidence_id: E-C17-024, claim: "MCP协议授权硬化不自动解决业务授权、责任和自主等级。", class: STANDARD-PRIMARY, source_ids: [MCP-2026, PREFLIGHT], limitations: "协议层与业务层分开。"}
  - {evidence_id: E-C17-025, claim: "D22数据只分training/regression/holdout/representative real-world四层，security/red-team横跨四层且非补偿。", class: METHODOLOGY, source_ids: [DECISIONS, QUALITY], limitations: "不是第五层。"}
  - {evidence_id: E-C17-026, claim: "C14只交付自主等级矩阵、审批策略、委托与撤销记录三件母产物。", class: METHODOLOGY, source_ids: [BOOK-V2, C17-CARD, DECISIONS], limitations: "运行材料不是第四件。"}
  - {evidence_id: E-C17-027, claim: "状态化离线夹具28个trial得到11 PASS、14 FAIL、3 REVIEW_REQUIRED且effect ledger确认外部副作用为0；代表性真实任务计数为0，六个拟迁移场景只是合成holdout shadow。", class: LOCAL-VALIDATION, source_ids: [LOCAL-INPUT, LOCAL-RUN, LOCAL-SCRIPT], limitations: "作者合成状态夹具，不证明真实平台或真实任务迁移。"}
  - {evidence_id: E-C17-028, claim: "夹具从原始身份、grant、policy、撤销、scope、effect、stop、rollback、break-glass和再认证记录推导模糊同意、自我扩权、过期撤销、转委托扩权、旧缓存、参数对象偷换、UNKNOWN、取消和双人复核。", class: LOCAL-VALIDATION, source_ids: [LOCAL-INPUT, LOCAL-RUN, LOCAL-SCRIPT], limitations: "仍需独立实践复跑、近邻变体和真实平台验证。"}

