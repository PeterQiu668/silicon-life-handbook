findings:
  - id: P1-C14-01
    severity: P1
    title: identity intent and approver independence rely on caller labels
    minimum_fix_contract:
      - canonicalize stable principals and aliases
      - derive requester approver and executor independence from an identity graph
      - reject chat intent as authority without a signed versioned grant record
  - id: P1-C14-02
    severity: P1
    title: grant object parameter time policy and revocation lack authoritative readback
    minimum_fix_contract:
      - bind grant issuer action object scope parameter hash policy version and validity window
      - compare the frozen execution request against the current authoritative grant
      - make revocation and current policy override cached approval
  - id: P1-C14-03
    severity: P1
    title: delegation attenuation and revocation propagation lack a state graph
    minimum_fix_contract:
      - compute child scope as an intersection and enforce depth expiry and use limits
      - enumerate child grant session queue cache and temporary grant residuals
      - fail any negative-access test in which an old reference remains executable
  - id: P1-C14-04
    severity: P1
    title: UNKNOWN effects and cancel stop rollback are not independently evidenced
    minimum_fix_contract:
      - derive effect state and counts from an effect ledger
      - record readback retries and idempotency-key reuse
      - use distinct cancel stop-receipt and rollback-proof states
  - id: P1-C14-05
    severity: P1
    title: break-glass and recertification consume conclusion booleans
    minimum_fix_contract:
      - derive break-glass validity from registered type target scope expiry and independent reviewer principal
      - compare pre and post fingerprints for model tool object parameters owner policy and environment
      - freeze the old grant on any material diff until recertification completes
  - id: P1-C14-06
    severity: P1
    title: run schema and real-world provenance fail open
    minimum_fix_contract:
      - hard fail duplicate task and trial IDs and invalid field combinations
      - require source run and evidence IDs for representative-real-world records
      - derive external effect and real-world counts from actual records rather than labels or constants
exercise_decisions:
  x_c14_01: REVIEW_REQUIRED
  x_c14_02: REVIEW_REQUIRED
  reasons:
    - raw identity grant consumption and effect ledgers are not executed
    - delegation revocation break-glass and recertification are not statefully derived
    - real authorization service and platform revocation propagation are not run
