limitations:
  - The fixture is deterministic and synthetic; no real identity graph authorization service scheduler channel credential or production state was used.
  - Reported zero external side effects are a hardcoded output field rather than an effect-ledger readback.
  - Six synthetic shadows are not representative-real-world executions.
  - OpenClaw and Hermes authorization revocation propagation and host stop receipts were not run.
