findings:
  - id: P1-C14-PF-01
    severity: P1
    title: positive revocation result masks later UNKNOWN and effect checks
    status: closed_in_v3_1
    minimum_fix_contract:
      - do not finalize PASS from a successful negative-access observation
      - continue all applicable checks and aggregate FAIL before REVIEW_REQUIRED before PASS
      - ensure UNKNOWN blind retry and confirmed writes cannot be masked by positive evidence
  - id: P1-C14-PF-02
    severity: P1
    title: valid break-glass result masks later recertification checks
    status: closed_in_v3_1
    minimum_fix_contract:
      - treat valid break-glass as an audit fact rather than a final PASS
      - continue material-change and recertification evaluation
      - preserve security and permission hard-failure priority
  - id: P1-C14-PF-03
    severity: P1
    title: representative-real-world provenance IDs are not resolved
    status: closed_in_v3_1_for_manifest_resolution
    minimum_fix_contract:
      - resolve source run and evidence IDs against a trusted manifest and immutable digests
      - bind origin permission time environment and content hash
      - return REVIEW_REQUIRED when provenance authenticity is outside harness scope
