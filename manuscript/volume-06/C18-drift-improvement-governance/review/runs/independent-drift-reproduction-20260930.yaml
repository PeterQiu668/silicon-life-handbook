findings:
  - id: P1-C15-01
    severity: P1
    title: drift confirmation lacks baseline and independent-run lineage
    minimum_fix_contract:
      - bind baseline observed bundle comparison contract and task budget risk permission environment hashes
      - derive repetition from distinct complete run manifests
      - map insufficient or mismatched comparison evidence to REVIEW_REQUIRED
  - id: P1-C15-02
    severity: P1
    title: dataset grader and intervention lineage are not derived
    minimum_fix_contract:
      - derive holdout access from logs and an access matrix
      - freeze and compare grader and rubric hashes
      - derive changed-variable count from exact candidate diff
  - id: P1-C15-03
    severity: P1
    title: identity approval and target binding are not stateful
    minimum_fix_contract:
      - canonicalize proposer evaluator approver and owner identities
      - validate approval status scope expiry policy candidate hash and target hash
      - re-read current target before experiment or solidification
  - id: P1-C15-04
    severity: P1
    title: permission security and goal changes rely on a caller label
    minimum_fix_contract:
      - derive governance changes from baseline and candidate diffs
      - hard fail unauthorized permission security grader or goal changes
      - trigger external approval and recertification for any autonomy-radius change
  - id: P1-C15-05
    severity: P1
    title: shadow UNKNOWN and external effects lack ledgers
    minimum_fix_contract:
      - inspect shadow outbox queue memory and notification writes
      - derive effect state counts retry and idempotency from a ledger
      - forbid blind retry and fail zero-write on any confirmed external effect
  - id: P1-C15-06
    severity: P1
    title: rollback does not verify a complete bundle or revoked-state preservation
    minimum_fix_contract:
      - restore and hash the full dependency bundle
      - verify queue cache session index and external terminal state
      - preserve revocation and deletion tombstones and run negative access tests
  - id: P1-C15-07
    severity: P1
    title: run schema and representative-real-world provenance fail open
    minimum_fix_contract:
      - hard fail duplicate base task and trial IDs
      - require verifiable source run and evidence IDs for real-world records
      - derive real-world and external-effect counts from actual evidence
