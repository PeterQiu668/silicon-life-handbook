limitations:
  - The fixture is deterministic and synthetic; no real platform identity approval shadow canary or production state was used.
  - Reported zero external effects are a constant output rather than effect-ledger evidence.
  - Fifteen synthetic shadows are not representative-real-world executions.
  - Muse remains a vendor-claim mirror and was not executed or internally inspected.
