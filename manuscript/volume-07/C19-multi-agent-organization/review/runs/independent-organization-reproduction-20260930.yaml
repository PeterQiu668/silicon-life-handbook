findings:
  p0: []
  p1:
    - {id: P1-C16-01, title: verdicts consume preadjudicated booleans instead of raw organization state}
    - {id: P1-C16-02, title: fairness contract is reported but does not gate PASS}
    - {id: P1-C16-03, title: any positive quality delta can bypass extreme cost latency and human burden}
    - {id: P1-C16-04, title: schema permits invalid enums empty trial sets and unresolved real-world evidence references}
    - {id: P1-C16-05, title: external effects are not derived and FAIL can coexist with zero_external_effects true}
    - {id: P1-C16-06, title: three trials per scenario are identical expansion rather than independent runs}

minimum_closure_contract:
  - strict schema rejects unknown fields invalid enums and nonpositive trial counts
  - bind both comparison arms to task input permission budget risk acceptance and environment hashes and block PASS when incomparable
  - derive identity authorization credentials and revocation from principal grant and credential state
  - derive single-writer conflict cancel propagation budget stop ghost success and effects from immutable ledgers and terminal readback
  - enforce hard gates before approved vector net-benefit comparison and do not allow tiny quality gain to compensate extreme burden
  - give every trial independent run trace evidence input and terminal hashes and reject duplicate runs
  - resolve every representative-real-world row against a verified origin source run evidence manifest record
  - rerun all thirty-one mutations after remediation

