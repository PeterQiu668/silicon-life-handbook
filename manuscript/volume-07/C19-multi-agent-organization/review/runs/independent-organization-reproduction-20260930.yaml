limitations:
  - All reproduction and mutation runs were offline and synthetic with no network credentials user data or production side effects.
  - Real OpenClaw Hermes A2A identity authorization concurrent writes cancel stop terminal readback and representative-real-world execution were not run.
  - PASS applies only to byte-stable reproduction and the explicitly effective schema checks; it does not apply to machine control or chapter practice.
