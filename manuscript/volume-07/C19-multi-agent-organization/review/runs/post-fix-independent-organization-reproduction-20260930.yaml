    - {id: P1-C16-PF-01, severity: P1, title: frozen shadow count is 12 while remediation and requested invariant say 9}
    - {id: P1-C16-PF-02, severity: P1, title: malformed grant timestamps and alias collisions can pass identity and credential controls}
    - {id: P1-C16-PF-03, severity: P1, title: unknown writers same-result unmerged writes and FACT zero-origin minimum can pass}
    - {id: P1-C16-PF-04, severity: P1, title: stop threshold or cancel requested with receipt NONE can pass}
    - {id: P1-C16-PF-05, severity: P1, title: FAILED or UNKNOWN run evidence and UNKNOWN effects do not affect verdict}
    - {id: P1-C16-PF-06, severity: P1, title: duplicate evidence ids across runs are not rejected}

minimum_closure_contract:
  - resolve whether the frozen shadow invariant is 9 or 12 and synchronize builder input results summary README remediation and acceptance contract
  - parse and validate authorization timestamps against an explicit request or execution clock and enforce distinct-principal constraints where role isolation is required
  - require known writer principals and fail any multiple unmerged events on the same object and base regardless of result version
  - require FACT minimum independent origins to be positive and all source refs to resolve
  - at or above stop threshold require verified stop and all work stopped; after cancel request receipt NONE cannot pass
  - bind D21 terminal claims to evidence records and map FAILED to FAIL and UNKNOWN to REVIEW_REQUIRED
  - map UNKNOWN effect state to reconciliation and non-PASS while preserving hard-failure priority
  - enforce globally unique evidence ids and separate binding digest from semantic independence digest

