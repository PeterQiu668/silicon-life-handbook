findings:
  closed:
    - {id: P1-X17-R01, basis: old truthy D21 fields rejected and evidence refs are resolved for existence layer terminal authority and status}
    - {id: P1-X17-R02, basis: control-plane objects now use closed-world required optional keys strict types and enums}
    - {id: P1-X17-01, basis: D22 layers shadow counts and real-world manifest are now machine-enforced}
    - {id: P1-X17-02, basis: decisions derive from raw route handoff writer effect cancel progress branch receipt and D21 state rather than fault labels}
  open:
    - id: P1-C17-PF-01
      severity: P1
      title: D21 source and digest are shape-checked but not semantically bound to trusted observer task run and target object
    - id: P1-C17-PF-02
      severity: P1
      title: route capability evidence references are accepted when nonempty without registry resolution

minimum_closure_contract:
  - bind every D21 record to task run attempt layer object and trusted observer or authoritative system identity
  - compare object digest to canonical target bytes or an independently trusted expected digest instead of regex only
  - red-team cross-task cross-run evidence replay source alias collision and well-formed wrong digest
  - resolve capability evidence references against a trusted registry bound to agent capability task class evaluation version scope status expiry and digest
  - reject unknown expired revoked wrong-agent wrong-capability wrong-task and wrong-version capability evidence and keep UNKNOWN non-PASS

